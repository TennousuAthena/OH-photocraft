[package]
name = "photocraft-ui-egui"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
photocraft-geom = { path = "../../upstream/crates/geom" }
photocraft-color = { path = "../../upstream/crates/color" }
photocraft-raster = { path = "../../upstream/crates/raster" }
photocraft-doc = { path = "../../upstream/crates/doc" }
photocraft-compose = { path = "../../upstream/crates/compose" }
photocraft-gpu = { path = "../../upstream/crates/gpu" }
photocraft-engine = { path = "../photocraft-engine" }
photocraft-plugins = { path = "../../upstream/crates/plugins" }
photocraft-algo = { path = "../../upstream/crates/algo" }
photocraft-text = { path = "../../upstream/crates/text" }
photocraft-vector = { path = "../../upstream/crates/vector" }
egui = "=0.36.2"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"
