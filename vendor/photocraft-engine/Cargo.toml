[package]
name = "photocraft-engine"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[features]
corpus = []

[dependencies]
photocraft-geom = { path = "../../upstream/crates/geom" }
photocraft-color = { path = "../../upstream/crates/color" }
photocraft-cms = { path = "../../upstream/crates/cms" }
photocraft-raster = { path = "../../upstream/crates/raster" }
photocraft-doc = { path = "../../upstream/crates/doc" }
photocraft-ops = { path = "../../upstream/crates/ops" }
photocraft-compose = { path = "../../upstream/crates/compose" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
photocraft-paint = { path = "../../upstream/crates/paint" }
photocraft-algo = { path = "../../upstream/crates/algo" }
photocraft-text = { path = "../../upstream/crates/text" }
photocraft-vector = { path = "../../upstream/crates/vector" }
photocraft-io = { path = "../../upstream/crates/io" }
photocraft-psd = { path = "../../upstream/crates/psd" }
photocraft-format = { path = "../../upstream/crates/format" }
photocraft-plugins = { path = "../../upstream/crates/plugins" }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
photocraft-codecs = { path = "../../upstream/crates/codecs" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
photocraft-raw = { path = "../../upstream/crates/raw", features = ["testgen"] }
wat = "1.228"
